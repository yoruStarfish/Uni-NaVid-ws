controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1   # 原本 0.5
      movement_time_allowance: 20.0   # 原本 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.18 #0.10
      yaw_goal_tolerance: 0.18 #0.12
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56 #50 # 56
      model_dt: 0.05 # 0.01 (1/controller_frequency) <= model_dt
      # num_samples: 2000
      batch_size: 2000 #1500 # 2000
      ax_max: 0.4
      ax_min: -0.3
      ay_max: 3.0
      ay_min: -3.0
      az_max: 1.0
      vx_std: 0.1 #0.2
      vy_std: 0.2
      wz_std: 0.15 #0.15 #0.2
      vx_max: 0.15
      vx_min: -0.3
      vy_max: 0.5
      wz_max: 1.9 # 0.5 #1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      publish_optimal_trajectory: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          # "PreferForwardCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "TwirlingCritic"
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.5 # 原本為 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0 # 6.0 5.0
        threshold_to_consider: 2.0  
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0 # 3.0 # i have modified this from 3.0 to 1.0
        threshold_to_consider: 0.3 # 直到機器人退到距離終點 10 公分以內之前，都不要去管最終的車身朝向，先給我退進去再說
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0 # 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true # set to true to consider the robot footprint in cost calculations # 原本為 false
        collision_cost: 1000000.0
        near_goal_distance: 1.0 #1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0 # 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5 #0.2 # 0.5
        offset_from_furthest: 3 # 20 # 短距離篩選的路徑點比較少
        use_path_orientations: false # 這樣 MPPI 就會乖乖照著 Planner 算出來的倒車角度去執行，不會隨意切換成往前開
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.8 #0.2 # 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0 # 6.0 # 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5 # 0.5
        max_angle_to_furthest: 1.0   # 原本 1.0
        mode: 0
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom # original: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 5 # x-axis of the robot # orignal: 48
      height: 5 # y-axis of the robot # original: 3
      resolution: 0.05
      robot_radius: 0.25
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.0005
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        observation_persistence: 5  # How long to store messages in a buffer to add to costmap before removing them (s).
        scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        # 新增這段相機設定(除了依靠lidar掃描點雲外，還要依靠相機的點雲資訊來避障)
        camera_cloud:
            topic: /camera/camera/depth/color/points  # 請確認這是不是你的點雲 topic
            #max_obstacle_height: 2.0
            min_obstacle_height: 0.1   # 一樣設 10 公分
            clearing: True
            marking: True
            data_type: "PointCloud2"
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: True
      #   publish_voxel_map: True
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 2.0
      #   mark_threshold: 0
      #   observation_sources: pointcloud
      #   pointcloud:
      #       topic: /velodyne_points
      #       max_obstacle_height: 2.0
      #       clearing: True
      #       marking: True
      #       raytrace_max_range: 3.0
      #       raytrace_min_range: 0.0
      #       obstacle_max_range: 2.5
      #       obstacle_min_range: 0.0
      #       data_type: "PointCloud2"
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True

