planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]    
    service_introspection_mode: "disabled"
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"  # 改用 Smac 混合規劃器
      motion_model_for_search: "REEDS_SHEPP"         # 關鍵：允許前進與後退混合的運動模型
      reverse_penalty: 1.0                           # 允許長距離倒車；Smac 要求此值 >= 1.0
      cost_penalty: 3.0                              # Prefer lower-cost routes away from obstacles
      change_penalty: 5.0 # 0.5 # 0.2                            # 降低前進/倒車反覆切換，避免終點附近繞一下
      non_straight_penalty: 1.2                      # Reduce the strong preference for straight motion
      minimum_turning_radius: 0.2                   # Trial wider arcs instead of tight 0.2 m turns
      tolerance: 0.5                                 # 不接受離目標太遠的近似解，避免到點後再補轉朝向
      downsample_costmap: false
      allow_unknown: true
      goal_heading_mode: "DEFAULT"                   # 嚴格使用送進來的終點朝向
    # GridBased:
    #   plugin: "nav2_navfn_planner/NavfnPlanner"
    #   tolerance: 0.5
    #   use_astar: false
    #   allow_unknown: false
# Not included in the course 
# planner_server_rclcpp_node:
#   ros__parameters:
#     use_sim_time: True


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      use_sim_time: False
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      footprint_padding: 0.0005
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # A relative topic will be appended to the parent of the global_costmap namespace.
          # For example:
          #   * User chosen namespace is `tb4`.
          #   * User chosen topic is `scan`.
          #   * Topic will be remapped to `/tb4/scan` without `global_costmap`.
          #   * Use global topic `/scan` if you do not wish the node namespace to apply
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.25  # meters; graded costs guide paths toward corridor centers
      always_send_full_costmap: True
      service_introspection_mode: "disabled"
